# https://moonrepo.dev/docs/config/toolchain
$schema: 'https://moonrepo.dev/schemas/toolchain.json'

# Enabling the Rust toolchain is what lets moon read the path dependencies out
# of the Cargo.toml files and build its project graph from them, which is what
# makes `--affected` correct.
#
# There is deliberately no `version` here. rust-toolchain.toml already pins the
# compiler, rustup already installs it on demand, and every Rust developer
# already knows that. Setting a version here hands the install to proto instead,
# which buys a second installer for a problem that was already solved.
rust: {}
