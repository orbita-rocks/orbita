[package]
name = "orbita-server"
description = "The worker: gRPC surface, request routing, and the linearizable read path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The dependency on orbita-control is one adapter, in `control.rs`. This crate
# still consumes the partition map through its own `MapSource` trait, so a test
# or a single node supplies a static map and nothing else in here knows the
# difference.

[dependencies]
orbita-core.workspace = true
orbita-control.workspace = true
orbita-runtime.workspace = true
orbita-proto.workspace = true
orbita-storage.workspace = true
orbita-wal.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
prost = "0.13"
tonic = "0.12"

[dev-dependencies]
orbita-sim = { path = "../orbita-sim" }
orbita-proto.workspace = true
