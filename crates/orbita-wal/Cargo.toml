[package]
name = "orbita-wal"
description = "Write-ahead log and its two-of-three replication protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Nothing here is published to crates.io yet. The product is the binary and
# the image, and putting ten crates on the registry would be a semver promise
# about `orbita-core`'s types that we are not ready to make.
publish = false

[dependencies]
orbita-core.workspace = true
orbita-runtime.workspace = true
# Only for the hydration hook: it is called through a trait object, and an
# async method in one of those is not something the language does yet.
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
crc32fast = "1.5.0"
# Only the synchronisation primitives, which are executor agnostic. Nothing
# here spawns, sleeps, or touches the Tokio reactor, so the WAL still runs
# unchanged under the simulator's single threaded scheduler.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
# Property-based testing for the frame and wire decoders: round-trip identity
# over generated records, and the stronger claim that arbitrary bytes cannot
# panic a decoder. Test-only.
proptest.workspace = true
