[package]
name = "orbita-storage"
description = "Single-partition storage engine over RocksDB: versioned values, conditional writes, and TTL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Nothing here is published to crates.io yet. The product is the binary and
# the image, and putting ten crates on the registry would be a semver promise
# about `orbita-core`'s types that we are not ready to make.
publish = false

[dependencies]
orbita-core.workspace = true
orbita-runtime.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
rocksdb = "0.24.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
