[package]
name = "orbita-control"
description = "The leader group: partition map, membership, failover, and split and merge decisions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Nothing here is published to crates.io yet. The product is the binary and
# the image, and putting ten crates on the registry would be a semver promise
# about `orbita-core`'s types that we are not ready to make.
publish = false

[dependencies]
orbita-core.workspace = true
orbita-runtime.workspace = true
orbita-proto.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tonic = "0.12"
async-trait = "0.1"
crc32fast = "1.5.0"
# Credentials must not come from the seeded generator in orbita-runtime, whose
# own documentation forbids it. This is the operating system's entropy, used in
# exactly one place and never on a path the simulator has to reproduce.
getrandom = "0.2"
sha2 = "0.10"
# Only the synchronisation primitives, which are executor agnostic. Nothing
# here spawns, sleeps, or touches the Tokio reactor, so the control plane runs
# unchanged under the simulator's single threaded scheduler.
tokio = { version = "1", default-features = false, features = ["sync"] }
# The consensus state machine under `RaftLog`. Chosen over openraft because it
# owns no IO at all: the driver in `src/raft.rs` ticks it, carries its
# messages, and persists its log, all through orbita-runtime's seams, which is
# what keeps elections reproducible under the simulator.
raft = { version = "0.7", default-features = false, features = ["prost-codec"] }
# raft's message types are prost 0.11 messages, and encoding them needs the
# trait from the same prost the types were generated with. This is not the
# workspace's protobuf story; orbita-proto has its own.
prost = "0.11"
# raft insists on a slog logger. It gets slog::Discard, and everything worth
# saying is said through `tracing` by the driver instead.
slog = "2"

[dev-dependencies]
orbita-sim = { path = "../orbita-sim" }
orbita-wal.workspace = true
