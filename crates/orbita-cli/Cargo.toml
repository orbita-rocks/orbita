[package]
name = "orbita-cli"
description = "The orbita binary: runs a node in either role, and wraps the admin API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Nothing here is published to crates.io yet. The product is the binary and
# the image, and putting ten crates on the registry would be a semver promise
# about `orbita-core`'s types that we are not ready to make.
publish = false

# The crate is called orbita-cli so it sorts next to its siblings, but the
# thing a user installs is called `orbita`. One binary, not two, because the
# role a node runs in is configuration rather than a different program.
[[bin]]
name = "orbita"
path = "src/main.rs"

[lib]
name = "orbita_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bytes.workspace = true
clap = { version = "4.6.5", features = ["derive", "wrap_help"] }
# The node process is the one place that installs an exporter, so the heavy
# OpenTelemetry pieces live here rather than in the libraries that emit signals.
# rt-tokio because the OTLP batch and periodic exporters run their background
# work on the same runtime the node already has, which is also what a
# deterministic build would swap out. grpc-tonic so the exporter speaks OTLP
# over the tonic stack the rest of the binary links anyway. tls-webpki-roots so
# an `https://` collector endpoint gets a TLS connector backed by bundled trust
# roots: without it grpc-tonic has no way to establish TLS, and a production
# collector would be reachable only over plaintext OTLP. Webpki roots rather
# than the system trust store so the image needs no CA bundle baked in.
opentelemetry.workspace = true
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
    "grpc-tonic",
    "tls-webpki-roots",
    "trace",
    "metrics",
] }
tracing-opentelemetry = "0.28"
orbita-core.workspace = true
orbita-objectstore = { workspace = true, features = ["s3"] }
orbita-proto.workspace = true
# The line editor for `orbita repl`, and the first line-editing dependency in
# the workspace. rustyline over reedline on purpose: it is smaller and older,
# pulls fewer transitive crates, and is synchronous, which is the exact shape of
# the REPL loop (read a line, then block the session's runtime on dispatching
# it). reedline is built for nushell's async, multi-line, styled prompt and
# would be weight spent on features a thin operator console does not use. See
# src/repl.rs for the same reasoning at the call site.
rustyline = "15"
# The only thing that uses this is src/node.rs, which is the one place in the
# crate that starts a server rather than dialing one. It goes through the
# workspace like every other sibling, because a literal version here is a copy
# of the workspace version that nothing keeps in sync.
orbita-server.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio.workspace = true
toml = "1.1.4"
tonic = "0.12"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
