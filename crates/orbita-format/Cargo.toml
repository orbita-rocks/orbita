[package]
name = "orbita-format"
description = "The Orbita partition format: segments, manifests, and the commit protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Nothing here is published to crates.io yet. The product is the binary and
# the image, and putting ten crates on the registry would be a semver promise
# about `orbita-core`'s types that we are not ready to make.
publish = false

[features]
# The in-memory object store, so other crates can exercise the format without
# a bucket. Off by default because nothing in production should link it.
testing = []

[dependencies]
orbita-core.workspace = true
orbita-objectstore.workspace = true
# The in-memory store stamps write times from the runtime clock, not the wall
# clock, so a simulated run drives the orphan-sweep grace period deterministically.
orbita-runtime.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
crc32c.workspace = true
# For `buffer_unordered` alone. Building a partition's index is one ranged read
# per segment for the footer and another for the key index, and doing those in
# sequence makes a cold open cost round trips rather than bytes: measured at
# 2.36s for a 309 MiB partition against real S3, almost all of it waiting. These
# are combinators rather than an executor, so the simulator still drives them
# deterministically and nothing here spawns a task.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
proptest.workspace = true
# The byte-decoder property tests repair CRC32C checksums after mutating an
# input, so a corrupted-but-checksum-valid object flows past the integrity gate
# into the parsing logic. That needs the same hasher the encoders use.
crc32c.workspace = true
