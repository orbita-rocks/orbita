syntax = "proto3";

package orbita.v1;

// The client-facing data API.
//
// This is deliberately small enough to use from generated stubs with no
// hand-written client library. A client connects to any worker, and the worker
// forwards the request to the partition owner if it is not the owner itself,
// so nothing here exposes partitions, node addresses, or routing.
service Kv {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

// The precondition a write must satisfy.
//
// An absent condition means write unconditionally. These are what make the
// store usable for locks and catalog pointers.
message Condition {
  oneof kind {
    // Apply only if the key does not exist. An expired key counts as absent.
    bool if_not_present = 1;
    // Apply only if the key exists at exactly this version.
    uint64 if_version = 2;
  }
}

message GetRequest {
  string keyspace = 1;
  bytes key = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  // The version of the returned value. Feed this back into a Condition to
  // perform a compare-and-swap.
  uint64 version = 3;
  // Absolute expiry in Unix milliseconds; unset means no TTL.
  optional uint64 expires_at_millis = 4;
}

message SetRequest {
  string keyspace = 1;
  bytes key = 2;
  bytes value = 3;
  // Time to live from when the owner commits the write. Unset means no
  // expiry. The server converts this to an absolute deadline immediately, so
  // replication lag cannot extend it.
  optional uint64 ttl_millis = 4;
  Condition condition = 5;
}

message SetResponse {
  // False when the condition was not met, in which case the write did not
  // happen and current_version reports what was actually there.
  bool applied = 1;
  // The version after a successful write.
  uint64 version = 2;
  // On a failed condition, the version found instead. Unset if the key did
  // not exist.
  optional uint64 current_version = 3;
}

message DeleteRequest {
  string keyspace = 1;
  bytes key = 2;
  Condition condition = 3;
}

message DeleteResponse {
  bool applied = 1;
  // True if the key existed before this call.
  bool existed = 2;
  optional uint64 current_version = 3;
}

message ListRequest {
  string keyspace = 1;
  bytes prefix = 2;
  // Opaque continuation token from a prior response. Empty starts at the
  // beginning of the prefix.
  bytes cursor = 3;
  // Maximum entries to return, capped by the server at MAX_LIST_LIMIT.
  uint32 limit = 4;
  // When false, entries carry keys only. Callers that just need the key set
  // should leave this false; it avoids reading values that get discarded.
  bool include_values = 5;
}

message ListEntry {
  bytes key = 1;
  bytes value = 2;
  uint64 version = 3;
  optional uint64 expires_at_millis = 4;
}

message ListResponse {
  repeated ListEntry entries = 1;
  // Empty when the scan is complete.
  //
  // Each page is a consistent snapshot of one partition's range. A scan
  // spanning multiple pages is not a point-in-time snapshot of the keyspace,
  // and callers that need one must build it themselves.
  bytes next_cursor = 2;
}
