syntax = "proto3";

package orbita.v1;

// The operator-facing control API, served by the leader group.
//
// The CLI is a thin wrapper over this, so anything an operator can do is
// scriptable by construction.
service Admin {
  rpc CreateKeyspace(CreateKeyspaceRequest) returns (Keyspace);
  rpc UpdateKeyspace(UpdateKeyspaceRequest) returns (Keyspace);
  rpc DeleteKeyspace(DeleteKeyspaceRequest) returns (DeleteKeyspaceResponse);
  rpc ListKeyspaces(ListKeyspacesRequest) returns (ListKeyspacesResponse);

  rpc CreateCredential(CreateCredentialRequest) returns (CreateCredentialResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);

  // Cluster inspection: the partition map, worker membership, and health.
  rpc DescribeCluster(DescribeClusterRequest) returns (DescribeClusterResponse);

  // Manual overrides. The leader splits, merges, and rebalances on its own;
  // these exist for operators who need to force the issue.
  rpc SplitPartition(SplitPartitionRequest) returns (SplitPartitionResponse);
  rpc MergePartitions(MergePartitionsRequest) returns (MergePartitionsResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);

  // Advances the active cluster version once every live node can speak the
  // new one. This is the one-way door at the end of a rolling upgrade; see
  // docs/UPGRADES.md.
  rpc FinalizeUpgrade(FinalizeUpgradeRequest) returns (FinalizeUpgradeResponse);
}

// The protocol and format version a cluster has agreed to speak. Not a binary
// version: before 1.0 the minor is the compatibility unit, so the patch
// component of a binary version has no business here.
message ClusterVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message KeyspaceConfig {
  // Applied to writes that do not specify their own TTL. Unset means keys do
  // not expire by default.
  optional uint64 default_ttl_millis = 1;
  // Per-keyspace cap, which cannot exceed the global MAX_VALUE_BYTES.
  optional uint64 max_value_bytes = 2;
  // Storage quota across all partitions of this keyspace. Unset is unlimited.
  optional uint64 max_storage_bytes = 3;
  // Request rate caps, so one tenant cannot starve the others.
  optional uint32 max_reads_per_second = 4;
  optional uint32 max_writes_per_second = 5;
}

message Keyspace {
  uint64 id = 1;
  string name = 2;
  KeyspaceConfig config = 3;
  uint64 created_at_millis = 4;
  // Current partition count, which grows as the keyspace splits.
  uint32 partition_count = 5;
  // Bytes stored across this keyspace's partitions. Exact when
  // partitions_without_size is zero, and a lower bound otherwise.
  uint64 stored_bytes = 6;
  // How many of this keyspace's partitions had no owner reporting a size when
  // this was measured, which is what a fenced partition looks like while the
  // control plane waits for its replicas to report past the fence.
  //
  // Nonzero means stored_bytes is a floor, not a total. Reported rather than
  // folded in, because a sum that quietly omits a contributor reads as a
  // small number rather than an incomplete one, and quota saturation is
  // exactly the place that reading costs something. A floor is still enough
  // to prove a keyspace is over its quota; it is not enough to prove it is
  // under.
  uint32 partitions_without_size = 7;
}

message CreateKeyspaceRequest {
  string name = 1;
  KeyspaceConfig config = 2;
}

message UpdateKeyspaceRequest {
  string name = 1;
  KeyspaceConfig config = 2;
}

message DeleteKeyspaceRequest {
  string name = 1;
  // Deleting a keyspace destroys its data. The name must be repeated here to
  // make that hard to do by accident from a script.
  string confirm_name = 2;
}

message DeleteKeyspaceResponse {}

message ListKeyspacesRequest {}

message ListKeyspacesResponse {
  repeated Keyspace keyspaces = 1;
}

enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_READ = 1;
  PERMISSION_WRITE = 2;
}

message CreateCredentialRequest {
  // Keyspaces this credential may touch. Empty is rejected; a credential
  // scoped to nothing is always a mistake.
  repeated string keyspaces = 1;
  repeated Permission permissions = 2;
  string description = 3;
  optional uint64 expires_at_millis = 4;
}

message CreateCredentialResponse {
  string credential_id = 1;
  // Returned once, at creation, and never retrievable again.
  string secret = 2;
}

message RevokeCredentialRequest {
  string credential_id = 1;
}

message RevokeCredentialResponse {}

message DescribeClusterRequest {
  // Restrict the partition list to one keyspace. Empty returns all of them.
  string keyspace = 1;
}

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_LEADER = 1;
  NODE_ROLE_WORKER = 2;
}

enum NodeHealth {
  NODE_HEALTH_UNSPECIFIED = 0;
  NODE_HEALTH_HEALTHY = 1;
  // Missed heartbeats, but not yet declared dead.
  NODE_HEALTH_SUSPECT = 2;
  NODE_HEALTH_DEAD = 3;
}

message Node {
  uint64 id = 1;
  string address = 2;
  NodeRole role = 3;
  NodeHealth health = 4;
  // True for the current Raft leader of the control plane.
  bool is_raft_leader = 5;
  // The cluster versions this node's binary can speak, inclusive at both
  // ends. This is what finalize-upgrade checks before it advances.
  ClusterVersion speaks_min = 6;
  ClusterVersion speaks_max = 7;
  // The memory this node's partition indexes hold, summed over every
  // partition it reported. Since ADR 0006 made the index memory-resident,
  // this is the resource a worker runs out of first.
  //
  // Explicitly optional because unset and zero are different answers and the
  // difference matters most exactly when it is easiest to get wrong: a node
  // running a binary from before this field existed reports nothing, and
  // rendering that as an empty index tells an operator they have room they do
  // not have. Unset means nobody measured it. Zero means nobody is holding
  // one. A node the leader has never heard from is unset too.
  optional uint64 index_memory_bytes = 8;
}

message Replica {
  uint64 node_id = 1;
  // How far this replica has applied, for comparison against the owner's
  // lamport. The gap is what decides whether it can serve a read locally and
  // how far behind it would be if promoted.
  uint64 applied_lamport = 2;
  // How far this replica has made durable in its write-ahead log. Two
  // different lags fall out of this and they mean different things: the gap
  // to the owner's committed lamport is replication lag, and the gap down to
  // applied_lamport is log this replica holds but has not applied yet.
  uint64 durable_lamport = 3;
}

message Partition {
  uint64 id = 1;
  uint64 keyspace_id = 2;
  // Half-open range [start_key, end_key). An empty end_key means unbounded.
  bytes start_key = 3;
  bytes end_key = 4;
  uint64 owner_node_id = 5;
  // Bumped on every ownership change; a write carrying a stale epoch is
  // rejected, which is what fences a deposed owner.
  uint64 epoch = 6;
  // The owner's durable position, which is this partition's committed one.
  // Unset when no owner has reported it: an unowned partition, or one held
  // fenced while its replicas report past the fence. Lamport zero is a real
  // position a partition can be at, so it cannot also mean "nobody said".
  optional uint64 committed_lamport = 7;
  repeated Replica replicas = 8;
  // What the owner reported this partition holds. Unset for the same reason
  // committed_lamport is. A fenced partition holding a gigabyte has an
  // unknown size, not a size of zero, and an operator deciding what it can
  // afford to lose needs to be able to tell those apart.
  optional uint64 size_bytes = 9;
  // What the owner's memory-resident index costs for this partition. Per
  // ADR 0006 the index is resident whether or not the values are, and a
  // single partition's index has to fit on its owner, so this is a number an
  // operator sizes machines against rather than an implementation detail.
  //
  // Optional for the same reason index_memory_bytes is: an unowned partition,
  // and one whose owner runs a binary that does not measure this, have no
  // answer rather than an answer of zero.
  optional uint64 index_bytes = 10;
}

message DescribeClusterResponse {
  repeated Node nodes = 1;
  repeated Partition partitions = 2;
  // The active cluster version every node has agreed to speak.
  ClusterVersion cluster_version = 3;
  // Every keyspace the description covers, carried so that stored_bytes can
  // be read against the storage quota in its config. A partition list says
  // nothing about how close a tenant is to being refused writes.
  repeated Keyspace keyspaces = 4;
}

message SplitPartitionRequest {
  uint64 partition_id = 1;
  // Where to split. Empty asks the owner to choose a midpoint by size.
  bytes split_key = 2;
}

message SplitPartitionResponse {
  Partition lower = 1;
  Partition upper = 2;
}

message MergePartitionsRequest {
  // Must be adjacent, in order, and in the same keyspace.
  uint64 lower_partition_id = 1;
  uint64 upper_partition_id = 2;
}

message MergePartitionsResponse {
  Partition merged = 1;
}

message TransferOwnershipRequest {
  uint64 partition_id = 1;
  // Must already be a replica of this partition, since a transfer to a node
  // with no data would mean an unavailable partition until it hydrates.
  uint64 to_node_id = 2;
}

message TransferOwnershipResponse {
  Partition partition = 1;
}

message FinalizeUpgradeRequest {}

// What the finalize committed. After this lands, rolling back is not
// supported; the only path backwards is a restore.
message FinalizeUpgradeResponse {
  ClusterVersion previous = 1;
  ClusterVersion active = 2;
}
