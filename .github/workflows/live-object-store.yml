name: Live object store

# Runs the live conditional-write tests against a real AWS S3 bucket and a real
# Cloudflare R2 bucket.
#
# The store claims three backends. MinIO is proved on every pull request by the
# `check` job in ci.yml, because it is a container we can start. AWS S3 and R2
# were, until this workflow, verified by reading their documentation, which is
# not evidence. The specific failure this exists to catch is a backend that
# accepts `If-Match` and ignores it: that backend passes every mocked test in
# orbita-objectstore, and then loses the deposed-writer race in production,
# where a stale writer overwrites the manifest a newer writer just committed.
# Nothing short of a real socket to a real bucket tells us it did not happen.
#
# GCS is deliberately out of scope. Its XML interoperability layer ignores
# these headers and wants `x-goog-if-generation-match` instead, so it needs a
# different `ObjectStore`, not this one with a different endpoint. The module
# docs in crates/orbita-objectstore/src/s3/mod.rs say the same thing.
#
# The buckets, the AWS IAM role this job assumes, and the R2 API token all come
# from the Terraform in terraform/, so setting this up for the first time is a
# `terraform apply` plus a handful of repository secrets. Both are documented in
# terraform/README.md and in docs/BUILD.md under "Live object store
# verification".
#
# AWS is authenticated with GitHub OIDC: the job below assumes an IAM role
# scoped to this repository and this workflow, with a policy that reaches no
# further than the `orbita-it/*` prefix, and never touches a long-lived AWS key.
# R2 stays on a scoped API token because Cloudflare has no equivalent of AWS's
# OIDC role assumption for R2; terraform/README.md records that finding.

on:
  schedule:
    # Weekly, Mondays at 08:00 UTC, an hour after the nightly in ci.yml so the
    # two are not competing for the same runners.
    #
    # Weekly rather than nightly, which is the cadence sim-long uses, because
    # this job is not watching our code. It is watching two vendors, and vendor
    # behaviour does not change on our commit cadence. Against that, every run
    # spends real credentials on real buckets and carries a real chance of a
    # network blip, and a job that cries wolf on a Tuesday gets ignored by
    # Friday. The signal here is worth more than the latency: if AWS quietly
    # regressed conditional PUT, our remedy is to stop claiming support or to
    # work around it, and neither of those lands inside a week anyway.
    - cron: "0 8 * * 1"

  # On demand, which is how the first run after an operator creates the secrets
  # should happen, and how to check a backend before cutting a release or after
  # a meaningful change to the signing or conditional-write paths.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: conditional writes against ${{ matrix.backend }}
    runs-on: ubuntu-latest

    permissions:
      # The AWS row assumes an IAM role via GitHub's OIDC provider, and minting
      # the OIDC token needs this. It is set here on the job rather than at the
      # top of the file so the `notify` job, which files an issue, does not carry
      # a token-minting permission it has no use for. `contents: read` is
      # restated because naming any permission here drops the workflow default.
      contents: read
      id-token: write

    # Never run in a fork. A fork has no buckets and no credentials, and it
    # never will, so the only thing a scheduled run there produces is a failure
    # notification for somebody who cannot act on it.
    #
    # This is not the same call as the MinIO step in ci.yml, which deliberately
    # has no `if:` because "a durability test that skips itself is worse than no
    # test". That rule is about the pull request path, where the credentials are
    # a container we start ourselves and so cannot be missing. Here they are
    # supplied by a human out of band. The rule still holds inside this
    # repository, which is why the guard below is a hard failure and not a skip.
    if: github.repository == 'orbita-rocks/orbita'

    strategy:
      # One backend failing says nothing about the other, and finding out that
      # both broke in the same week is worth more than saving a runner minute.
      fail-fast: false
      matrix:
        include:
          # The endpoints are not here, because the `secrets` context is not
          # readable from a matrix and R2's hostname contains the account id.
          # They are built in the first step instead, from the region and the
          # account id, so there is no second stored value that has to agree
          # with the first one.
          - backend: AWS S3
            # OIDC: this row assumes an IAM role instead of reading a stored
            # key. The role ARN is a secret only because it embeds the AWS
            # account id, the same reason the R2 account id is one; the
            # assumption itself is gated by the role's trust policy, not by the
            # ARN being hard to guess.
            auth: oidc
            role_arn_secret: LIVE_S3_ROLE_ARN
            region: ${{ vars.LIVE_S3_REGION }}
            # AWS addresses buckets as `bucket.s3.<region>.amazonaws.com` and
            # has path style on a deprecation path, so this is the one backend
            # that turns the store's path-style default off. That also means it
            # is the only live coverage of the virtual-host branch of the
            # request builder.
            path_style: "false"
            bucket_secret: LIVE_S3_BUCKET

          - backend: Cloudflare R2
            # Keys, not OIDC. Cloudflare has no AWS-style OIDC role assumption
            # for R2, so this row keeps a scoped API token. terraform/README.md
            # has the finding in full.
            auth: keys
            # Not a choice. R2 has no regions and rejects a SigV4 signature
            # scoped to anything else.
            region: auto
            # R2 serves both addressing styles, so it stays on the default and
            # exercises the same path-style branch MinIO does.
            path_style: "true"
            bucket_secret: LIVE_R2_BUCKET
            access_key_secret: LIVE_R2_ACCESS_KEY_ID
            secret_key_secret: LIVE_R2_SECRET_ACCESS_KEY

    steps:
      # This runs before checkout so a missing secret costs a second rather
      # than a full toolchain install.
      #
      # It fails rather than skipping. Inside this repository an absent secret
      # is our misconfiguration, and the cost of getting it wrong is precisely
      # the thing this workflow was built to stop: a green check that stands in
      # for evidence nobody collected. The first Monday after this merges will
      # be red until somebody creates the secrets, and that is the alarm working.
      - name: Resolve the endpoint and check the credentials are configured
        env:
          BACKEND: ${{ matrix.backend }}
          AUTH: ${{ matrix.auth }}
          REGION: ${{ matrix.region }}
          BUCKET: ${{ secrets[matrix.bucket_secret] }}
          # The AWS row assumes a role instead of reading a key, so the two are
          # dereferenced per row: the ARN for the oidc row, the access/secret
          # pair for the keys row. A step env block cannot be conditional, so
          # both are read and the unused one is an empty string that costs
          # nothing.
          ROLE_ARN: ${{ secrets[matrix.role_arn_secret] }}
          ACCESS_KEY: ${{ secrets[matrix.access_key_secret] }}
          SECRET_KEY: ${{ secrets[matrix.secret_key_secret] }}
          # Read unconditionally and used only by the R2 row, because a step
          # env block cannot be conditional and an unused empty string costs
          # nothing.
          R2_ACCOUNT_ID: ${{ secrets.LIVE_R2_ACCOUNT_ID }}
        run: |
          missing=""
          note() { missing="$missing $1"; }

          if [ -z "$REGION" ]; then
            note "vars.LIVE_S3_REGION"
          fi
          if [ -z "$BUCKET" ]; then
            note "secrets.${{ matrix.bucket_secret }}"
          fi

          # The credential shape differs by row. OIDC needs a role to assume;
          # keys need the pair. Checking the wrong one would either demand a
          # secret this row no longer uses or wave through a row with nothing to
          # authenticate with.
          case "$AUTH" in
            oidc)
              if [ -z "$ROLE_ARN" ]; then
                note "secrets.${{ matrix.role_arn_secret }}"
              fi
              ;;
            keys)
              if [ -z "$ACCESS_KEY" ]; then
                note "secrets.${{ matrix.access_key_secret }}"
              fi
              if [ -z "$SECRET_KEY" ]; then
                note "secrets.${{ matrix.secret_key_secret }}"
              fi
              ;;
            *)
              echo "::error::no auth rule for '$AUTH'"
              exit 1
              ;;
          esac

          case "$BACKEND" in
            "AWS S3")
              endpoint="https://s3.$REGION.amazonaws.com"
              ;;
            "Cloudflare R2")
              if [ -z "$R2_ACCOUNT_ID" ]; then
                note "secrets.LIVE_R2_ACCOUNT_ID"
              fi
              endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
              ;;
            *)
              echo "::error::no endpoint rule for $BACKEND"
              exit 1
              ;;
          esac

          if [ -n "$missing" ]; then
            echo "::error::$BACKEND is not configured. Missing:$missing"
            echo "docs/BUILD.md, under 'Live object store verification', says what each one holds; terraform/ provisions them."
            exit 1
          fi

          # Handed to the test step through the environment rather than a step
          # output, so the R2 account id inside it stays in the same masked
          # channel the secret it came from does.
          echo "ORBITA_S3_TEST_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          echo "$BACKEND is configured"

      # Every `uses:` in this job is pinned to a full commit SHA, with the tag
      # in a trailing comment. The rest of the repository still floats on tags,
      # and that is a defensible call for jobs that never see anything worth
      # stealing. This job is the exception: it assumes an AWS role and holds R2
      # credentials in its environment, so a moved or compromised action tag
      # here could persist code on the runner and walk off with live vendor
      # access. A SHA cannot be moved out from under us; a tag can. Bumping one
      # is a one-line change with a diff that names the new version, which is a
      # feature, not a chore. Resolve a new SHA with, for example,
      # `gh api repos/actions/checkout/commits/v4 --jq .sha`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No protoc step, unlike the jobs in ci.yml. orbita-objectstore depends on
      # no other crate in this workspace and nothing here compiles a proto, so
      # installing one would be a minute spent on nothing.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          # Pinning to a SHA freezes the ref the action would otherwise read to
          # pick a channel, so the channel is named explicitly here. This is the
          # tip of the action's `stable` branch, not a released tag, because
          # `@stable` is how the action selects the stable Rust channel and it
          # publishes no semver tag for it.
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          # Share nothing with the pull request cache. This job builds one crate
          # and runs weekly, so a shared key would mostly serve to evict entries
          # the merge gate depends on.
          shared-key: live-object-store

      # AWS only. Mint short-lived credentials by assuming the IAM role through
      # GitHub's OIDC provider, rather than reading a long-lived key out of a
      # secret. The role's trust policy is what constrains this, scoped to this
      # repository and this workflow; see terraform/. `output-credentials` hands
      # the minted key back as step outputs so the test step can put them in the
      # ORBITA_S3_TEST_* variables the test reads, including the session token
      # that temporary credentials require. The R2 row skips this entirely and
      # keeps its API-token secret.
      - id: aws-oidc
        if: matrix.auth == 'oidc'
        name: Assume the AWS test role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets[matrix.role_arn_secret] }}
          aws-region: ${{ matrix.region }}
          output-credentials: true

      # The same repository script the MinIO moon task in ci.yml runs, pointed
      # somewhere else. One definition, three backends: if it drifts, it drifts
      # for all of them at once instead of quietly covering only the cheap one.
      #
      # The task refuses to pass when the test binary turns out to contain no
      # tests, which is the failure a `cargo test` alone reports as success. It
      # runs directly here because loading the full workspace through Moon also
      # downloads unrelated toolchain plugins, adding network failures to a job
      # whose red is supposed to mean an object-store claim needs attention.
      - name: Live conditional-write tests
        env:
          # ORBITA_S3_TEST_ENDPOINT comes from the resolve step, through
          # GITHUB_ENV.
          ORBITA_S3_TEST_REGION: ${{ matrix.region }}
          ORBITA_S3_TEST_FORCE_PATH_STYLE: ${{ matrix.path_style }}
          ORBITA_S3_TEST_BUCKET: ${{ secrets[matrix.bucket_secret] }}
          # One test, two credential sources. The oidc row reads the key the
          # assume-role step minted; the keys row reads its stored secret. The
          # expression picks per row: when auth is oidc the step outputs are set
          # and the secret name is empty, and the reverse on the keys row.
          ORBITA_S3_TEST_ACCESS_KEY: ${{ matrix.auth == 'oidc' && steps.aws-oidc.outputs.aws-access-key-id || secrets[matrix.access_key_secret] }}
          ORBITA_S3_TEST_SECRET_KEY: ${{ matrix.auth == 'oidc' && steps.aws-oidc.outputs.aws-secret-access-key || secrets[matrix.secret_key_secret] }}
          # Only temporary credentials carry a session token. It is empty on the
          # keys row, and the test treats an empty value as absent.
          ORBITA_S3_TEST_SESSION_TOKEN: ${{ steps.aws-oidc.outputs.aws-session-token }}
        run: crates/orbita-objectstore/scripts/test-live-s3.sh

  # Who finds out when this breaks.
  #
  # Left alone, GitHub emails whoever last touched the cron line, which is an
  # accident of git history rather than a decision. So the failure becomes an
  # issue instead: it is durable, it is visible to everyone, it survives an
  # unread inbox, and it needs no webhook secret or third-party account.
  #
  # It is deliberately not a page. A failure here does not mean anything is
  # down. It means a claim we make about a backend may have stopped being true,
  # and the response is to reproduce it by hand, work out whether the vendor
  # changed or we did, and either fix the store or stop claiming the backend.
  # That is days of work, not minutes, and waking someone up buys none of it.
  notify:
    name: file the failure
    runs-on: ubuntu-latest
    needs: [live]
    # Only for the scheduled run. A `workflow_dispatch` failure already has
    # somebody watching it, and filing an issue at them is noise.
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out, so gh has no git remote to infer the
          # repository from and would fail before it filed anything.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live object store verification is failing"

          # A heredoc rather than a shell string, because a multi-line string
          # written inline here carries this file's indentation into the issue,
          # and markdown reads four leading spaces as a code block.
          {
            echo "The weekly live object store run failed: $RUN_URL"
            echo
            cat <<'EOF'
          This job checks that AWS S3 and Cloudflare R2 still enforce the conditional writes the partition manifest swap depends on. A backend that stopped enforcing them would let a deposed writer overwrite the manifest a newer writer had just committed, and nothing else in this repository would notice.

          Work out first whether the failure is the backend or the network. A connection or signing error is usually ours or transient. A conditional write that was supposed to lose and won is the finding this job exists to report, and it means the support claim in `crates/orbita-objectstore/src/s3/mod.rs` is no longer true.

          Reproduce it by hand against a bucket of your own using the environment variables documented in `crates/orbita-objectstore/tests/minio.rs`.
          EOF
          } > /tmp/live-object-store-body.md

          # One issue, updated by comment, rather than one per week. A pile of
          # identical issues is how a real finding gets lost.
          number="$(gh issue list --state open --search "$title in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file /tmp/live-object-store-body.md
          else
            # Assigned to the code owner of /crates/orbita-objectstore/. If
            # .github/CODEOWNERS changes, change this with it, or the alarm ends
            # up on somebody who has stopped reading it.
            gh issue create \
              --title "$title" \
              --label maintenance \
              --assignee bradhe \
              --body-file /tmp/live-object-store-body.md
          fi
