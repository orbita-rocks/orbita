name: Release PR

# Opens the pull request that becomes a release.
#
# The branch is cut from develop, the version is bumped on it, and the pull
# request targets main. That pull request is the release: reviewing it is
# reviewing everything that has accumulated on develop since the last one, in
# one diff, which is the only point in the process where somebody looks at the
# whole thing at once.
#
# It stops there on purpose. Merging is a human decision and so is tagging,
# because a tag is what publishes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, without the v (e.g. 0.1.0)"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    name: open the release pull request
    runs-on: ubuntu-latest
    steps:
      # A pull request opened with the default GITHUB_TOKEN does not start any
      # workflow, which would leave the release pull request sitting there with
      # no checks on it and nothing to gate the merge. RELEASE_TOKEN is a PAT or
      # an app token; the fallback keeps the workflow runnable without one, at
      # the cost of having to push an empty commit to wake CI up.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Refuse a version that already exists
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "::error::v${{ inputs.version }} is already tagged"
            exit 1
          fi

      # The compatibility rule from docs/UPGRADES.md is that before 1.0 a
      # minor bump is what is allowed to change the peer protocol or a
      # persisted format. A patch release carrying one of those changes would
      # silently break the rollback window, so it fails here instead.
      - name: Check the bump against what changed
        run: |
          version="${{ inputs.version }}"
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "No previous tag, nothing to compare against."
            exit 0
          fi
          patch_only=0
          if [ "${version%.*}" = "${last#v}" ] || [ "${version%.*}" = "$(echo "${last#v}" | cut -d. -f1,2)" ]; then
            patch_only=1
          fi
          if [ "$patch_only" -eq 1 ]; then
            if git diff --name-only "$last"..HEAD | grep -qE '^(proto/|crates/orbita-wal/|crates/orbita-proto/)'; then
              echo "::error::$version is a patch bump, but the wire protocol or the log format changed since $last. Cut a minor release instead."
              exit 1
            fi
          fi

      - name: Bump the version
        run: |
          chmod +x scripts/*.sh
          scripts/bump-version.sh "${{ inputs.version }}"

      - name: Commit on a release branch
        run: |
          git config user.name "orbita-release"
          git config user.email "release@orbita.rocks"
          git switch -c "release/v${{ inputs.version }}"
          git add -A
          git commit -m "chore(release): v${{ inputs.version }}"
          git push --force-with-lease origin "release/v${{ inputs.version }}"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          notes="$(git-cliff --unreleased --strip all --config cliff.toml || true)"
          cat > /tmp/body.md <<EOF
          This pull request releases v${{ inputs.version }}. It carries everything
          that has landed on \`develop\` since the last release, plus the version
          bump itself.

          Merging it does not publish anything. Publishing starts when the tag is
          pushed, which is a separate step described in
          [docs/RELEASING.md](docs/RELEASING.md).

          **Merge this with a merge commit, not a squash.** A squash rewrites the
          develop commits, which stops develop from being an ancestor of main and
          breaks every release after this one.

          ## Changes

          ${notes}
          EOF
          gh pr create \
            --base main \
            --head "release/v${{ inputs.version }}" \
            --title "v${{ inputs.version }} release" \
            --body-file /tmp/body.md
