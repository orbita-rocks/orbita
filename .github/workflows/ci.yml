name: CI

on:
  # develop is the integration branch and the default, so it is what the README
  # badge reports. main is here because releases come off it, and a release
  # branch with no CI history is the wrong thing to cut from.
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    # Nightly, for the long simulation batch.
    - cron: "0 7 * * *"

env:
  CARGO_TERM_COLOR: always

  # A runner has about 14 GB of disk, and RocksDB compiles to a 1.4 GB static
  # archive when it carries debug info. cargo builds it once per profile shape,
  # so clippy, the test harness, and a plain build each get their own copy, and
  # together they fill the disk and the job dies in the linker. Dropping the
  # debug info takes each copy to under 200 MB. Nothing in CI runs a debugger,
  # so this costs nothing here, and it is set only here so that a laptop still
  # builds something you can break on.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # moon compares against the base revision to decide what a change
          # affects, so it needs more than the tip commit.
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # The compiler version comes from rust-toolchain.toml, so CI and a
      # developer laptop cannot drift apart. Rust is installed first, because
      # moon only runs cargo and does not install it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: moonrepo/setup-toolchain@v0
        with:
          # Keep auto-install off. It runs `proto install`, and proto reads
          # rust-toolchain.toml as a version file, so it takes the Rust install
          # away from rustup and leaves a toolchain with no cargo in it.
          auto-install: false
          # The action installs `latest` unless told otherwise; it does not read
          # .prototools. Bump this and .prototools together.
          moon-version: '2.4.6'

      - uses: Swatinem/rust-cache@v2

      # Scoped to the Rust crates, because the end-to-end suite also has a
      # `test` task and it belongs to the job below.
      - run: moon run :fmt :lint :test --query "language=rust"

  # A separate job because these fail for different reasons than the Rust
  # tests do: this one is the wire contract as seen by a client that shares no
  # code with the server, so a failure here means the protocol is wrong rather
  # than the implementation.
  e2e:
    name: end-to-end from a Python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: moonrepo/setup-toolchain@v0
        with:
          # Keep auto-install off. It runs `proto install`, and proto reads
          # rust-toolchain.toml as a version file, so it takes the Rust install
          # away from rustup and leaves a toolchain with no cargo in it.
          auto-install: false
          # The action installs `latest` unless told otherwise; it does not read
          # .prototools. Bump this and .prototools together.
          moon-version: '2.4.6'

      - uses: Swatinem/rust-cache@v2

      # No setup-python step. The Python version is pinned in
      # .moon/toolchains.yml and moon installs it, so it is written down once
      # rather than here and nowhere else.

      # This one target builds the binary, creates the virtualenv, installs the
      # test dependencies, and runs the suite, because the task graph says those
      # are what it needs. The stubs are generated during the run, so this is
      # also the check that the checked-in protos compile with a toolchain that
      # knows nothing about tonic.
      - run: moon run e2e:test

  simulation:
    name: deterministic simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: moonrepo/setup-toolchain@v0
        with:
          # Keep auto-install off. It runs `proto install`, and proto reads
          # rust-toolchain.toml as a version file, so it takes the Rust install
          # away from rustup and leaves a toolchain with no cargo in it.
          auto-install: false
          # The action installs `latest` unless told otherwise; it does not read
          # .prototools. Bump this and .prototools together.
          moon-version: '2.4.6'

      - uses: Swatinem/rust-cache@v2

      # Simulation runs are seeded, so a failure here reports a seed that
      # reproduces it exactly on any machine, with a paste-ready command.
      # Pull requests get a short batch to keep the feedback loop tight.
      - name: Run simulation seeds
        if: github.event_name != 'schedule'
        run: moon run orbita-sim:sim

      # Nightly explores far more of the state space. The seed count lives in
      # the task definition rather than here, so the long batch can be run by
      # hand exactly as the nightly runs it.
      - name: Run the long simulation batch
        if: github.event_name == 'schedule'
        run: moon run orbita-sim:sim-long
