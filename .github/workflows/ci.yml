name: CI

on:
  # develop is the integration branch and the default, so it is what the README
  # badge reports. main is here because releases come off it, and a release
  # branch with no CI history is the wrong thing to cut from.
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    # Nightly, for the long simulation batch.
    - cron: "0 7 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # The toolchain version comes from rust-toolchain.toml, so CI and a
      # developer laptop cannot drift apart.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features

  # A separate job because these fail for different reasons than the Rust
  # tests do: this one is the wire contract as seen by a client that shares no
  # code with the server, so a failure here means the protocol is wrong rather
  # than the implementation.
  e2e:
    name: end-to-end from a Python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Only the binary, since the tests drive it as a subprocess and nothing
      # here needs the test targets built.
      - name: Build the orbita binary
        run: cargo build --bin orbita

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install the test dependencies
        run: pip install -r tests/e2e/requirements.txt

      # The stubs are generated during the run, so this step is also the check
      # that the checked-in protos compile with the stock toolchain.
      - name: Run the end-to-end tests
        working-directory: tests/e2e
        env:
          ORBITA_BINARY: ${{ github.workspace }}/target/debug/orbita
        run: python -m pytest

  simulation:
    name: deterministic simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Simulation runs are seeded, so a failure here reports a seed that
      # reproduces it exactly on any machine, with a paste-ready command.
      # Pull requests get a short batch to keep the feedback loop tight.
      - name: Run simulation seeds
        if: github.event_name != 'schedule'
        run: cargo test -p orbita-sim --release

      # Nightly explores far more of the state space. The seed count is the
      # knob worth raising when a release is close.
      - name: Run the long simulation batch
        if: github.event_name == 'schedule'
        env:
          ORBITA_SIM_SEEDS: "50000"
        run: cargo test -p orbita-sim --release
