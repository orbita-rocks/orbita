name: Prerelease

# What a push to develop produces.
#
# The point is that there is always something to install that is newer than the
# last release, so a bug report can be answered with "try develop" instead of
# "wait for 0.2.0". These artifacts are deliberately less than a release: no
# GitHub release, no moving tags, no chart. They are for people who already
# know what develop is.
#
# The version does not change per commit. develop sits at the next version with
# a -dev suffix, and the commit is identified by the sha in the image tag and
# by the sha the binary reports in --version.

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/orbita-rocks/orbita

permissions:
  contents: read

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `develop` floats and `sha-` is immutable. Anything reproducing a
      # problem should be quoting the sha tag, because `develop` will have
      # moved by the time anybody reads the report.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_JOBS=8
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary:
    name: linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --bin orbita

      # One target rather than the release matrix. Somebody who needs a
      # develop build on a Mac can build it, and paying for four runners on
      # every merge to develop would not be worth what it buys.
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-develop-x86_64-unknown-linux-gnu
          path: target/release/orbita
          retention-days: 30
          if-no-files-found: error
