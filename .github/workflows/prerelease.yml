name: Prerelease

# What the latest develop produces each night, or when requested by hand.
#
# The point is that there is always something to install that is newer than the
# last release, without paying for an emulated ARM build after every merge. A
# bug report can still be answered with "try develop", and a build needed
# sooner can be dispatched by hand. These artifacts are deliberately less than
# a release: no GitHub release, no chart. They are for people who already know
# what develop is.
#
# The version does not change per commit. develop sits at the next version with
# a -dev suffix, and the commit is identified by the sha in the image tag and
# by the sha the binary reports in --version.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

# Both triggers publish the same moving tag. If somebody requests a build while
# the nightly is still running, only the newer result is worth finishing.
concurrency:
  group: prerelease-develop
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/orbita-rocks/orbita

  # Keep in step with .prototools and with ci.yml.
  MOONREPO_CLI_VERSION: '2.4.6'

permissions:
  contents: read

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The -dev version has to exist as a tag because develop's own install
      # paths pin it: bump-version.sh writes the workspace version into the
      # image tags in deploy/manifests/orbita.yaml and into the chart's
      # appVersion, which values.yaml defaults the image tag to. Without this
      # step both of those resolve to something never pushed, so applying the
      # manifests straight off develop is an ImagePullBackOff.
      - id: version
        name: Read the version develop's manifests pin
        run: |
          # The same expression release.yml verifies the tag against, so the
          # two cannot disagree about where the version lives.
          version="$(perl -0ne 'print $1 if /\[workspace\.package\]\nversion = "([^"]+)"/' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::could not read the workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

          # Only a prerelease version gets a version tag. This workflow can be
          # dispatched against any ref, and on a released version that would
          # push a develop build to the name of a real release, silently
          # replacing it.
          case "$version" in
            *-dev) echo "dev=true" >>"$GITHUB_OUTPUT" ;;
            *)     echo "dev=false" >>"$GITHUB_OUTPUT"
                   echo "::notice::$version is not a -dev version, so no version tag was published" ;;
          esac

      # `develop` and the -dev version both float; `sha-` is immutable.
      # Anything reproducing a problem should be quoting the sha tag, because
      # the other two will have moved by the time anybody reads the report.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.dev }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_JOBS=8
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary:
    name: linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: false
          moon-version: ${{ env.MOONREPO_CLI_VERSION }}

      - uses: Swatinem/rust-cache@v2

      # The same task a release runs, so a develop binary and a released one
      # are built the same way and a problem with the build shows up here
      # first rather than during a release.
      - run: moon run orbita-cli:build-release

      # One target rather than the release matrix. Somebody who needs a
      # develop build on a Mac can build it, and paying for four runners on
      # every merge to develop would not be worth what it buys.
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-develop-x86_64-unknown-linux-gnu
          path: target/release/orbita
          # A prerelease is a short-lived diagnostic. Releases own durable
          # artifacts, while seven days covers the useful life of develop.
          retention-days: 7
          if-no-files-found: error

  cleanup:
    name: expire old prerelease images
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete SHA-only images older than 30 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
              {
                org: context.repo.owner,
                package_type: 'container',
                package_name: 'orbita',
                per_page: 100,
              },
            );

            for (const version of versions) {
              const tags = version.metadata?.container?.tags ?? [];
              const shaOnly = tags.length > 0 && tags.every((tag) => tag.startsWith('sha-'));
              if (!shaOnly || Date.parse(version.updated_at) >= cutoff) {
                continue;
              }
              await github.rest.packages.deletePackageVersionForOrg({
                org: context.repo.owner,
                package_type: 'container',
                package_name: 'orbita',
                package_version_id: version.id,
              });
            }
