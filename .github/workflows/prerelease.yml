name: Prerelease

# What a push to develop produces.
#
# The point is that there is always something to install that is newer than the
# last release, so a bug report can be answered with "try 0.2.0-dev" instead of
# "wait for 0.2.0". These artifacts are deliberately less than a release: no
# GitHub release, no `latest`, no chart. They are for people who already know
# what develop is.
#
# Every tag carries a version. There is no branch-named tag, because a tag
# called `develop` says nothing about what is inside it: two pulls a release
# apart get incompatible binaries with no way to tell from the name.
#
# The version does not change per commit. develop sits at the next version with
# a -dev suffix, and the commit is identified by the sha in the image tag and
# by the sha the binary reports in --version.

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/orbita-rocks/orbita

  # Keep in step with .prototools and with ci.yml.
  MOONREPO_CLI_VERSION: '2.4.6'

permissions:
  contents: read

jobs:
  # Each architecture builds on its own native runner and pushes an untagged
  # image by digest; the image job below stitches the digests into one tagged
  # multi-arch manifest. Building both platforms on one runner would put the
  # arm64 half through QEMU emulation, which turns a minutes-long Rust build
  # into hours.
  image-build:
    name: container image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: BUILD_JOBS=8
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The digest is the only thing the merge job needs, carried as an empty
      # file named after it.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: container image
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # This job stitches digests together and would otherwise need no source,
      # but the tag it stamps on the manifest comes from the workspace version
      # in Cargo.toml. Checkout runs first because it cleans the workspace, and
      # the digests land outside it in /tmp.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The -dev version is the only human-readable tag this workflow pushes,
      # and develop's own install paths pin it: bump-version.sh writes the
      # workspace version into the image tags in deploy/manifests/orbita.yaml
      # and into the chart's appVersion, which values.yaml defaults the image
      # tag to. Without this step both of those resolve to something never
      # pushed, so applying the manifests straight off develop is an
      # ImagePullBackOff.
      - id: version
        name: Read the version develop's manifests pin
        run: |
          # The same expression release.yml verifies the tag against, so the
          # two cannot disagree about where the version lives.
          version="$(perl -0ne 'print $1 if /\[workspace\.package\]\nversion = "([^"]+)"/' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::could not read the workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

          # A non-dev version would put a develop build at the name of a real
          # release, silently replacing it. This workflow takes a bare
          # workflow_dispatch and does not pin its checkout, so that is a ref
          # away rather than impossible. Failing is right: the version tag is
          # the only one anybody reads, so publishing without it would leave a
          # build reachable solely by sha and look like nothing happened.
          case "$version" in
            *-dev) ;;
            *)
              echo "::error::$version is not a -dev version. Prerelease publishes"
              echo "::error::versioned tags only, and pushing this one would replace a release."
              exit 1
              ;;
          esac

      # The -dev version floats, because it names a cycle rather than a build,
      # and `sha-` is immutable. Anything reproducing a problem should quote
      # the sha tag, since the version tag will have moved by the time anybody
      # reads the report.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=short

      - name: Merge the digests into a multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

  binary:
    name: linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: false
          moon-version: ${{ env.MOONREPO_CLI_VERSION }}

      - uses: Swatinem/rust-cache@v2

      # The same task a release runs, so a develop binary and a released one
      # are built the same way and a problem with the build shows up here
      # first rather than during a release.
      - run: moon run orbita-cli:build-release

      # One target rather than the release matrix. Somebody who needs a
      # develop build on a Mac can build it, and paying for four runners on
      # every merge to develop would not be worth what it buys.
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-develop-x86_64-unknown-linux-gnu
          path: target/release/orbita
          retention-days: 30
          if-no-files-found: error
