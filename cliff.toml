# git-cliff configuration.
#
# The commit history here is conventional, enforced by the skill in
# .agents/skills/conventional-commit-message, which means the changelog can be
# derived from it instead of maintained alongside it. The groups below mirror
# that skill's split between types that a user of a release cares about and
# types that only matter to somebody reading the source.

[changelog]
header = ""
# The commit link is built from a hardcoded URL rather than from a
# [remote.github] section on purpose. Configuring a remote makes git-cliff call
# the GitHub API, which needs a token, fails on a private repository, and turns
# changelog generation into a network operation. Both callers swallow its
# errors, so that failure would surface as an empty release section rather than
# as an error, which is the worst way to find out.
body = """
{% macro remote_url() %}https://github.com/orbita-rocks/orbita{% endmacro %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}- {{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
  # Visible. These are what somebody deciding whether to upgrade reads.
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = "^docs", group = "Documentation" },

  # Hidden. Real changes, but they do not move the version and they do not
  # change what a running cluster does, so they would only make the list longer.
  { message = "^refactor", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },

  # Anything else is a typo, not a new category. Without this, a commit typed
  # `choire:` or `wip:` becomes its own heading in the published notes, which
  # has already happened twice in this history. A new type worth publishing
  # gets a line above rather than arriving by accident.
  { message = ".*", skip = true },
]

# Anything with a breaking marker is promoted regardless of its type, because a
# breaking change hidden under `refactor` is exactly the thing a reader most
# needs to see.
protect_breaking_commits = true

filter_commits = false
tag_pattern = "v[0-9]*"
# Prerelease tags are excluded so that the notes for 0.2.0 cover everything
# since 0.1.0 rather than everything since the last -dev build.
skip_tags = ".*-dev.*"
topo_order = false
sort_commits = "oldest"
