[workspace]
resolver = "2"
members = [
    "crates/orbita-core",
    "crates/orbita-runtime",
    "crates/orbita-objectstore",
    "crates/orbita-format",
    "crates/orbita-proto",
    "crates/orbita-storage",
    "crates/orbita-wal",
    "crates/orbita-control",
    "crates/orbita-server",
    "crates/orbita-sim",
    "crates/orbita-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/orbita-rocks/orbita"
authors = ["The Orbita Authors"]

[workspace.dependencies]
orbita-core = { path = "crates/orbita-core" }
orbita-runtime = { path = "crates/orbita-runtime" }
orbita-objectstore = { path = "crates/orbita-objectstore" }
orbita-format = { path = "crates/orbita-format" }
orbita-proto = { path = "crates/orbita-proto" }
orbita-storage = { path = "crates/orbita-storage" }
orbita-wal = { path = "crates/orbita-wal" }
orbita-control = { path = "crates/orbita-control" }
orbita-server = { path = "crates/orbita-server" }
orbita-sim = { path = "crates/orbita-sim" }

async-trait = "0.1"
base64 = "0.22"
bytes = "1"
# OpenTelemetry API only. The crates that emit signals depend on this and
# nothing heavier: instruments come from the global meter, which is a no-op
# until the node process installs an exporter, so a library never drags the SDK
# or a collector connection into a test or a one-shot CLI call. The SDK and the
# OTLP exporter live in orbita-cli, the one place a node is actually started.
# Pinned to the 0.27 line because that is the series built against tonic 0.12
# and prost 0.13, which is what the rest of the workspace already resolves.
opentelemetry = "0.27"
# CRC32C, the Castagnoli polynomial the format specifies. This crate uses the
# hardware instruction where there is one and falls back to a table otherwise,
# which is the whole reason the format picked that polynomial.
crc32c = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Property-based testing for the byte decoders: round-trip identity over
# generated values, and the stronger claim that arbitrary bytes cannot panic a
# decoder. Test-only, so it never links into the binary or the image.
proptest = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
debug = 1
lto = "thin"
