# Three combined nodes, with no templating.
#
#   kubectl apply -f deploy/manifests/orbita.yaml
#
# This is the same topology the Helm chart produces. Every node serves the data
# path, while Orbita keeps three of them in the Raft voter set. Scale this
# StatefulSet to add worker capacity without editing existing nodes.
#
# Before this holds anything that matters, configure the shared object store.
# Combined nodes use its conditional writes to agree on one durable cluster
# identity and bootstrap certificate. As written, credentials use the AWS
# default chain. Use the Secret and set credential_source = "static" for MinIO,
# R2, or another S3-compatible store that only accepts access keys.
#
# Port 7100 is client and admin gRPC. Port 7101 is private peer traffic and is
# exposed only by the headless Service; see ADR 0004.
---
apiVersion: v1
kind: Namespace
metadata:
  name: orbita
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbita
  namespace: orbita
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: orbita-object-store
  namespace: orbita
type: Opaque
stringData:
  access_key_id: ""
  secret_access_key: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbita
  namespace: orbita
data:
  orbita.toml: |
    [node]
    listen = "0.0.0.0:7100"
    peer_listen = "0.0.0.0:7101"
    data_dir = "/var/lib/orbita"

    [cluster]
    name = "orbita"
    voter_target = 3
    allow_version_skew = false
    join_backoff_initial = "250ms"
    join_backoff_max = "10s"
    join_timeout = "5m"
    drain_timeout = "290s"

    [object_store]
    # endpoint = "https://s3.us-east-1.amazonaws.com"
    bucket = "orbita"
    region = "us-east-1"
    credential_source = "default"
    # role_arn = "arn:aws:iam::123456789012:role/orbita"
    # sts_endpoint = "https://sts.us-east-1.amazonaws.com"
    force_path_style = false

    [telemetry]
    # otlp_endpoint = "http://otel-collector.observability:4317"
    trace_sample_ratio = 1.0
    service_name = "orbita"
    log_level = "info"

    [telemetry.resource_attributes]
    "k8s.namespace.name" = "orbita"
---
# Stable discovery names are published before readiness so three fresh nodes
# can bootstrap concurrently rather than waiting on one another's probes.
apiVersion: v1
kind: Service
metadata:
  name: orbita-nodes
  namespace: orbita
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: orbita
    app.kubernetes.io/component: node
  ports:
    - name: grpc
      port: 7100
      targetPort: grpc
    - name: peer
      port: 7101
      targetPort: peer
---
# Any combined node can answer a client request and forward it to the owner.
apiVersion: v1
kind: Service
metadata:
  name: orbita
  namespace: orbita
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orbita
    app.kubernetes.io/component: node
  ports:
    - name: grpc
      port: 7100
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orbita
  namespace: orbita
  labels:
    app.kubernetes.io/name: orbita
    app.kubernetes.io/component: node
spec:
  serviceName: orbita-nodes
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: orbita
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbita
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: orbita
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orbita
              app.kubernetes.io/component: node
      containers:
        - name: orbita
          image: ghcr.io/orbita-rocks/orbita:0.2.0-dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ordinal="${HOSTNAME##*-}"
              fqdn="${HOSTNAME}.orbita-nodes.orbita.svc.cluster.local"
              export ORBITA_NODE_ID="$((1 + ordinal))"
              export ORBITA_ADVERTISE="${fqdn}:7100"
              export ORBITA_PEER_ADVERTISE="${fqdn}:7101"
              export ORBITA_FAILURE_DOMAIN="${NODE_NAME}"
              exec /usr/local/bin/orbita serve --role node
          env:
            - name: ORBITA_CONFIG
              value: /etc/orbita/orbita.toml
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ORBITA_OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: orbita-object-store
                  key: access_key_id
            - name: ORBITA_OBJECT_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: orbita-object-store
                  key: secret_access_key
          ports:
            - name: grpc
              containerPort: 7100
            - name: peer
              containerPort: 7101
          startupProbe:
            exec:
              command: &ready-probe
                - /usr/local/bin/orbita
                - --endpoint
                - http://127.0.0.1:7100
                - cluster
                - ready
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: *ready-probe
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/orbita
                - --endpoint
                - http://127.0.0.1:7100
                - cluster
                - ping
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /etc/orbita
              readOnly: true
            - name: data
              mountPath: /var/lib/orbita
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: orbita
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
# One voluntary disruption preserves both the two-of-three voter quorum and
# the two-of-three data durability quorum in the default deployment.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orbita
  namespace: orbita
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orbita
      app.kubernetes.io/component: node
