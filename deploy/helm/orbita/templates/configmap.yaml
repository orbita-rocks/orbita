{{/*
Everything that is not a secret and not per-pod goes in the file. Node id and
advertise address are per-pod and come from the environment instead, which is
exactly the split the configuration precedence was designed for.
*/}}
{{- include "orbita.validateObjectStore" . -}}
{{- if lt (int .Values.node.replicas) 3 -}}
{{- fail "node.replicas must be at least 3; use `orbita dev` for a supported single-node cluster" -}}
{{- end }}
{{- if not (has (int .Values.cluster.voterTarget) (list 3 5)) -}}
{{- fail "cluster.voterTarget must be 3 or 5" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbita.fullname" . }}
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
data:
  orbita.toml: |
    [node]
    listen = "0.0.0.0:{{ .Values.service.port }}"
    # The peer listener. It is only reachable through the headless Services,
    # which is where it should stay: peer traffic is compatible only within a
    # cluster version window and has no business leaving the cluster.
    peer_listen = "0.0.0.0:{{ .Values.service.peerPort }}"
    data_dir = "/var/lib/orbita"

    [cluster]
    name = {{ .Values.cluster.name | quote }}
    voter_target = {{ .Values.cluster.voterTarget }}
    allow_version_skew = {{ .Values.cluster.allowVersionSkew }}
    join_backoff_initial = {{ .Values.cluster.joinBackoffInitial | quote }}
    join_backoff_max = {{ .Values.cluster.joinBackoffMax | quote }}
    join_timeout = {{ .Values.cluster.joinTimeout | quote }}
    drain_timeout = {{ .Values.cluster.drainTimeout | quote }}

    [object_store]
    {{- if .Values.objectStore.endpoint }}
    endpoint = {{ .Values.objectStore.endpoint | quote }}
    {{- end }}
    bucket = {{ .Values.objectStore.bucket | quote }}
    region = {{ .Values.objectStore.region | quote }}
    # Written out even when it was defaulted, so that a rendered ConfigMap says
    # which identity this release authenticates as rather than leaving an
    # operator to reconstruct the rule.
    credential_source = {{ include "orbita.credentialSource" . | quote }}
    {{- with .Values.objectStore.roleArn }}
    role_arn = {{ . | quote }}
    {{- end }}
    {{- with .Values.objectStore.sessionName }}
    role_session_name = {{ . | quote }}
    {{- end }}
    {{- with .Values.objectStore.stsEndpoint }}
    sts_endpoint = {{ . | quote }}
    {{- end }}
    force_path_style = {{ .Values.objectStore.forcePathStyle }}

    [telemetry]
    {{- if .Values.telemetry.otlpEndpoint }}
    otlp_endpoint = {{ .Values.telemetry.otlpEndpoint | quote }}
    {{- end }}
    trace_sample_ratio = {{ .Values.telemetry.traceSampleRatio }}
    service_name = {{ .Values.telemetry.serviceName | quote }}
    log_level = {{ .Values.telemetry.logLevel | quote }}

    [telemetry.resource_attributes]
    "k8s.namespace.name" = {{ .Release.Namespace | quote }}
    {{- range $key, $value := .Values.telemetry.resourceAttributes }}
    {{ $key | quote }} = {{ $value | quote }}
    {{- end }}
    {{- with .Values.extraConfig }}

    {{ . | nindent 4 | trim }}
    {{- end }}
