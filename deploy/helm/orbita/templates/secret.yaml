{{- include "orbita.validateObjectStore" . }}
{{- if and (not .Values.objectStore.existingSecret) (or .Values.objectStore.accessKeyId .Values.objectStore.externalId) }}
{{/*
Only created when credential material is given inline and no existing Secret
was named. Inline values end up in the Helm release, which is readable by
anyone who can read releases, so a real deployment should set
objectStore.existingSecret instead — or, better, use
objectStore.credentialSource: instance-profile and have no Secret at all.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbita.fullname" . }}-object-store
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.objectStore.accessKeyId }}
  access_key_id: {{ .Values.objectStore.accessKeyId | quote }}
  secret_access_key: {{ .Values.objectStore.secretAccessKey | quote }}
  {{- end }}
  {{- with .Values.objectStore.externalId }}
  # Not an access key, but a shared secret the role's trust policy checks, and
  # it belongs in the same place as one.
  external_id: {{ . | quote }}
  {{- end }}
{{- end }}
