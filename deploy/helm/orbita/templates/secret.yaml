{{- if and (not .Values.objectStore.existingSecret) .Values.objectStore.accessKeyId }}
{{/*
Only created when credentials are given inline and no existing Secret was
named. Inline credentials end up in the Helm release, which is readable by
anyone who can read releases, so a real deployment should set
objectStore.existingSecret instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbita.fullname" . }}-object-store
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
type: Opaque
stringData:
  access_key_id: {{ .Values.objectStore.accessKeyId | quote }}
  secret_access_key: {{ .Values.objectStore.secretAccessKey | quote }}
{{- end }}
