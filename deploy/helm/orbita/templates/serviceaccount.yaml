{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orbita.serviceAccountName" . }}
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Orbita does not talk to the Kubernetes API, so it does not need a token
# mounted into every pod. Nothing has this account's credentials that does not
# need them.
automountServiceAccountToken: false
{{- end }}
