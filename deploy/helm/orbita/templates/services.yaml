apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbita.fullname" . }}-nodes
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "orbita.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: node
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
    - name: peer
      port: {{ .Values.service.peerPort }}
      targetPort: peer
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbita.fullname" . }}
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "orbita.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: node
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
