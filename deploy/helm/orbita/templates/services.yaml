{{/*
Three Services with three different jobs.

The two headless ones give every pod a stable DNS name, which is what the
bootstrap peer list and partition ownership both depend on. They carry both
ports, because a node reaches another node on the peer port and an operator
port-forwarding to one pod reaches it on the client port.

The third is the one clients use, and it carries the client port only. Peer
traffic uses a private framing that is compatible only within a cluster version
window, so the peer port must never end up behind a LoadBalancer or an Ingress.
Leaving it off this Service is what makes changing service.type safe.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbita.fullname" . }}-leader
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
    app.kubernetes.io/component: leader
spec:
  clusterIP: None
  # Peers have to be resolvable before they are ready, or the group can never
  # form: every member is waiting for the others to become ready first.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "orbita.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: leader
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
    - name: peer
      port: {{ .Values.service.peerPort }}
      targetPort: peer
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbita.fullname" . }}-worker
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "orbita.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
    - name: peer
      port: {{ .Values.service.peerPort }}
      targetPort: peer
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbita.fullname" . }}
  labels:
    {{- include "orbita.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Any worker answers any request, forwarding to the owner when it is not the
  # owner itself, so there is nothing here that has to be sticky or clever.
  selector:
    app.kubernetes.io/name: {{ include "orbita.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    # The client port only. Do not add the peer port here.
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
