# Defaults that deploy a working cluster on a fresh Kubernetes with no edits.
#
# The one thing worth setting before a real deployment is objectStore, because
# the default points at nothing and a cluster with no object storage keeps
# everything on local disks.

image:
  repository: ghcr.io/orbita-rocks/orbita
  # Empty means the chart's appVersion, so the image and the chart cannot drift
  # apart by accident.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Every process serves the worker data path. The voter target below selects an
# automatically managed subset for Raft, so adding replicas adds capacity
# without enlarging quorum.
node:
  replicas: 3
  terminationGracePeriodSeconds: 300
  persistence:
    enabled: true
    size: 100Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      # One CPU remains available for the dedicated control executor even when
      # the worker data path is busy.
      cpu: "2"
      memory: 4Gi
    limits:
      memory: 8Gi
  nodeSelector: {}
  tolerations: []
  # Spread the group across nodes, because three Raft members on one machine is
  # a single point of failure wearing a quorum as a disguise.
  topologySpreadEnabled: true

# The client-facing Service, in front of the workers. Any worker can answer any
# request, forwarding internally when it is not the owner, so a plain round
# robin Service is correct here and not a compromise.
#
# Only `port` is on this Service. `peerPort` is carried by the two headless
# Services and nowhere else, because peer traffic uses a private framing that
# is compatible only within a cluster version window and has no business being
# reachable from outside the cluster. See
# docs/adr/0004-peer-traffic-uses-private-framing.md. Setting service.type to
# LoadBalancer exposes the client port and nothing else, which is the point of
# keeping them apart.
service:
  type: ClusterIP
  port: 7100
  peerPort: 7101
  annotations: {}

# A NetworkPolicy that lets only this release's own pods open a peer
# connection. Off by default because it needs a CNI that enforces policy, and a
# policy that is silently ignored is worse than no policy: it reads like a
# control and is not one. Turn it on where the CNI supports it.
networkPolicy:
  enabled: false
  # Extra selectors allowed to reach the client port. Empty means every pod in
  # the cluster can, which is the same as having no policy on that port.
  clientFrom: []

cluster:
  name: orbita
  # Independent from node.replicas. Supported values are 3 and 5.
  voterTarget: 3
  # Inert, and kept only so that a values file carrying it does not break.
  # Refusing to start on a version mismatch was replaced by a cluster version
  # window: a node outside the window starts, reports itself not ready, and
  # says why, because a pod that exits stalls a rolling update with the cluster
  # half upgraded. Nothing checks a version yet. See docs/UPGRADES.md.
  allowVersionSkew: false
  # A worker that starts before the leader group retries rather than failing,
  # because pod start order is not something anyone controls. It gives up
  # eventually so that a worker which will never join shows up as a restarting
  # pod instead of a process waiting silently. Set joinTimeout to "0" to retry
  # forever.
  joinBackoffInitial: 250ms
  joinBackoffMax: 10s
  joinTimeout: 5m
  # Ten seconds shorter than the worker pod's grace period, so a failed drain
  # is logged and exits non-zero before Kubernetes has to send SIGKILL.
  drainTimeout: 290s

objectStore:
  endpoint: ""
  bucket: orbita
  region: us-east-1
  # AWS S3 wants this false. MinIO, R2, and most other S3-compatible stores
  # want it true.
  forcePathStyle: true

  # Where the node's S3 credentials come from.
  #
  #   default           Resolve at startup, in the order the AWS SDKs use:
  #                     AWS_ACCESS_KEY_ID from the environment, then EKS IRSA,
  #                     then the ECS/Pod Identity container endpoint, then the
  #                     EC2 instance profile. Whichever it picks is logged once
  #                     at startup. A shared ~/.aws profile is a startup error
  #                     rather than a silently skipped step.
  #   static            An access key pair, from the Secret below. This is what
  #                     MinIO and R2 need, because they offer nothing else.
  #   environment       AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and
  #                     optionally AWS_SESSION_TOKEN, injected by something
  #                     else in your pod spec.
  #   web-identity      EKS IRSA. The pod identity webhook injects
  #                     AWS_WEB_IDENTITY_TOKEN_FILE and AWS_ROLE_ARN when the
  #                     service account carries an eks.amazonaws.com/role-arn
  #                     annotation. This is the *workload* role.
  #   container         An ECS or Fargate task role, or the EKS Pod Identity
  #                     agent.
  #   instance-profile  Read from the EC2 instance metadata service over
  #                     IMDSv2. No Secret is created and none is mounted. The
  #                     nodes must run on instances with an instance profile
  #                     attached, and IMDSv2 must be enabled (`HttpTokens` may
  #                     be `required`; this chart never falls back to IMDSv1).
  #                     Note that on EKS this is the *node* role, which is not
  #                     the same principal as IRSA gives you.
  #
  # Empty picks one for you: static when accessKeyId or existingSecret is set,
  # and default otherwise. Naming it explicitly is better in production,
  # because then a source that is not there is a startup error rather than a
  # node quietly authenticating as something nobody expected.
  credentialSource: ""

  # A role to assume on top of whatever credentialSource produced. This is the
  # preferred AWS shape: the instance profile is permitted only to assume this
  # role, and the role carries the bucket policy, so storage access can be
  # re-scoped without touching a single instance. Leave roleArn empty to use
  # the base credentials against S3 directly.
  #
  # externalId is only for cross-account access, where the role's trust policy
  # demands it. It is delivered through the same Secret as the access keys,
  # because it is a shared secret whatever AWS calls it.
  roleArn: ""
  externalId: ""
  # What the assumed session is called in CloudTrail. Empty derives it from the
  # cluster name and the node id, which is what makes an audit log able to tell
  # two nodes apart.
  sessionName: ""

  # Overrides the STS endpoint used for role assumption and for the IRSA token
  # exchange. Empty derives a regional one from the region's partition, which
  # is correct in the commercial partition, in GovCloud, and in China. Set this
  # for a PrivateLink endpoint, for an isolated partition, or for a partition
  # newer than this chart.
  stsEndpoint: ""

  # Static credentials. Set existingSecret to bring your own, with keys
  # access_key_id and secret_access_key, and optionally external_id. Otherwise
  # the chart creates one from the values below, which is fine for a test
  # cluster and not for a real one: inline values end up in the Helm release,
  # readable by anyone who can read releases.
  #
  # existingSecret is read for access keys only when credentialSource resolves
  # to static. With a keyless source it is read only for external_id, and so it
  # requires roleArn; setting it without one is rejected at template time
  # rather than mounting a Secret nothing reads.
  #
  # Leave all three empty to deploy with no Secret at all.
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

telemetry:
  # The OTLP collector to push traces and metrics to. Orbita exports rather than
  # being scraped, so this is the whole switch: set it and the node ships spans
  # and per-keyspace, per-partition metrics to the collector on this endpoint,
  # which fans them out to Prometheus, Tempo, or wherever. Empty disables export
  # entirely; logs still go to stderr, because a node that cannot reach a
  # collector still has to start and still has to be debuggable.
  otlpEndpoint: ""
  # The fraction of traces to sample, decided once at the node that starts each
  # trace. 1.0 keeps everything, which is right until the trace volume says
  # otherwise.
  traceSampleRatio: 1.0
  serviceName: orbita
  logLevel: info
  resourceAttributes: {}
    # deployment.environment: production

# Anything else, appended verbatim to the generated orbita.toml. This is the
# escape hatch for an option the chart does not model yet, so that a missing
# value is never a blocker.
extraConfig: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# A disruption budget so that a rolling node drain cannot take the leader group
# below quorum. The leader minimum is computed from leader.replicas rather than
# fixed, so a five member group gets three and not two.
podDisruptionBudget:
  enabled: true

# Health probes, and these decide whether a rolling upgrade is safe.
#
# A StatefulSet replaces pods one at a time and will not move to the next one
# until the current one reports Ready, so readiness is the entire safety
# mechanism of an upgrade. Readiness means that this node has recovered its
# write-ahead log, opened every partition the map says it holds, caught up
# enough to serve them, and registered with the leader group where it has one.
#
# Readiness and startup run `orbita cluster ready`, which exits non-zero and
# names the unmet conditions until the node's readiness gate reports all of
# them met. Leaders wait for their durable Raft state and an elected quorum;
# workers wait until the control plane accepts their registration. Recovery
# and partition catch-up are asserted before either role reports Ready.
#
# Liveness is the opposite and stays conservative, because failing it kills the
# pod. It runs `orbita cluster ping`, which asks only whether the process
# responds, never anything about the cluster or about reaching peers. A
# liveness probe that depended on the leader group would turn a control plane
# outage or a network partition into every pod being killed at once.
#
# Slow starts belong to the startup probe. Recovering a large write-ahead log
# or waiting for the leader group legitimately takes time, and that is not the
# same as being wedged, so the startup budget is generous where the liveness
# threshold is not.
probes:
  readiness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 30
    failureThreshold: 4
  startup:
    enabled: true
    periodSeconds: 5
    # Five minutes for a leader, ten for a worker. A worker that starts before
    # the leader group retries until it can join, and killing it for that would
    # turn an ordinary rollout into a crash loop.
    nodeFailureThreshold: 120
