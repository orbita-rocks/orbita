# Helm overlay that points the chart's AWS knobs at a real EKS cluster and a
# real S3 bucket. Layer it on top of the defaults:
#
#   helm install orbita deploy/helm/orbita \
#     --namespace orbita --create-namespace \
#     --values deploy/helm/orbita/values-eks.yaml
#
# deploy/eks/up.sh does this for you after rendering the ${...} placeholders with
# envsubst. Only three values ever change, and one is derived for you:
#
#   ${ORBITA_EKS_ACCOUNT_ID}  read from `aws sts get-caller-identity`
#   ${ORBITA_EKS_REGION}      the region the cluster and bucket live in
#   ${ORBITA_EKS_BUCKET}      the test bucket name
#
# The IRSA role name is fixed at orbita-test-s3 to match the Terraform in
# deploy/eks/terraform, so it is baked into the ARN below and is not a value you
# fill. Fill the three tokens by hand if you are not using up.sh.
#
# Everything the chart already models for EKS is turned to its AWS position here
# and nowhere else, so the defaults file stays a laptop-and-MinIO file and this
# one carries the whole AWS story.

image:
  # The chart defaults to ghcr.io/orbita-rocks/orbita at the chart's appVersion.
  # A tag is set explicitly here because a test cluster should pin the exact
  # build under test rather than drift with the chart. Set it to the image you
  # want to exercise; up.sh leaves it at the chart default if you do not.
  tag: ""

serviceAccount:
  create: true
  # Fixed, not derived from the release name. The IRSA role Terraform creates
  # trusts exactly one subject, <namespace>:orbita, so the service account has to
  # be named orbita whatever the Helm release is called. Left to default, the
  # name follows the release name, and a release named anything but orbita would
  # deploy pods that cannot assume the role.
  name: orbita
  annotations:
    # This annotation is the entire IRSA handshake on the Kubernetes side. The
    # EKS pod-identity webhook sees it and injects AWS_WEB_IDENTITY_TOKEN_FILE
    # and AWS_ROLE_ARN into every Orbita pod, which is what credentialSource
    # web-identity below reads. The role is the one Terraform created, scoped to
    # exactly this service account and exactly the one bucket.
    eks.amazonaws.com/role-arn: arn:aws:iam::${ORBITA_EKS_ACCOUNT_ID}:role/orbita-test-s3

objectStore:
  # The regional S3 endpoint. Explicit rather than derived so the ConfigMap an
  # operator reads says exactly which endpoint the cluster talks to.
  endpoint: https://s3.${ORBITA_EKS_REGION}.amazonaws.com
  bucket: ${ORBITA_EKS_BUCKET}
  region: ${ORBITA_EKS_REGION}
  # IRSA. No access keys anywhere: the pod trades its projected OIDC token for a
  # session through sts:AssumeRoleWithWebIdentity. The chart renders no
  # credential Secret and no credential env for this source, which is the point
  # of it — there is nothing to leak.
  credentialSource: web-identity
  # AWS S3 addresses buckets as virtual hosts. The chart default is true for
  # MinIO and R2; real S3 wants false, and a wrong value here is a connection
  # that resolves to the wrong name rather than a clear error.
  forcePathStyle: false

# gp3 for both roles, provisioned by the StorageClass deploy/eks/up.sh applies.
# The chart default is empty, which would fall back to the cluster's gp2 default.
leader:
  persistence:
    storageClass: gp3
worker:
  persistence:
    storageClass: gp3
