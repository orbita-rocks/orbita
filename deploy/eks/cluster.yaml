# A disposable EKS cluster for testing and benchmarking Orbita against real AWS.
#
# Why eksctl and not Terraform. The repo already has Terraform (terraform/, for
# the live-object-store CI role), so this is a deliberate exception rather than
# an oversight. This cluster is disposable: the whole value is that bring-up and
# teardown are each one command and teardown leaves nothing behind to bill for.
# eksctl is built for exactly that. `eksctl create cluster -f` stands up the VPC,
# the control plane, a managed node group, the OIDC provider, and the IRSA role
# in one pass, and `eksctl delete cluster -f` removes every one of them by
# unwinding the CloudFormation stacks it created. Doing the same in Terraform
# means either assembling the VPC/EKS/OIDC/addon stack by hand or leaning on a
# large community module, and then carrying state for a cluster whose entire
# purpose is to be thrown away. Terraform earns its keep on durable, reviewable
# infrastructure; a throwaway test cluster is the case where it does not.
#
# This file is a template. up.sh fills the ${...} placeholders with envsubst and
# writes cluster.rendered.yaml (gitignored), because eksctl reads the region from
# the file rather than from a flag. You can also copy it and fill them by hand.
# Only region and bucket ever need setting here. The cluster name is fixed at
# orbita-test so the IRSA role name it derives stays in lockstep with the ARN in
# values-eks.yaml; change it in both files or not at all.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: orbita-test
  region: ${ORBITA_EKS_REGION}
  # A recent, EKS-supported Kubernetes. Pinned rather than latest so a bring-up
  # a month from now is the same cluster as one today.
  version: "1.30"
  tags:
    # Everything this file creates carries these, so a stray cluster is easy to
    # find and bill back, and a teardown can be audited for what it missed.
    orbita.rocks/purpose: test-and-benchmark
    orbita.rocks/disposable: "true"

# withOIDC provisions the IAM OIDC provider for the cluster, which is the
# precondition for IRSA: without it there is no issuer for AWS to trust the
# projected service-account token against.
iam:
  withOIDC: true
  serviceAccounts:
    # The workload role. Orbita's pods authenticate to S3 through IRSA
    # (credentialSource: web-identity), so this role's trust policy is scoped to
    # exactly one Kubernetes service account: orbita/orbita.
    #
    # roleOnly is the important flag. Helm owns the ServiceAccount object (it
    # creates it and carries the eks.amazonaws.com/role-arn annotation from
    # values-eks.yaml), so eksctl must create the IAM role and its trust policy
    # WITHOUT creating a second, conflicting service account. up.sh reads the
    # role ARN back out and feeds it to the annotation.
    - metadata:
        name: orbita
        namespace: orbita
      roleName: orbita-test-s3
      roleOnly: true
      # Least privilege, scoped to the one test bucket. List is needed for the
      # object-store client's ListObjectsV2; the object verbs are what a write,
      # a read, a manifest CAS, and compaction reclamation use. No s3:* and no
      # second bucket.
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: ListTheTestBucket
            Effect: Allow
            Action: s3:ListBucket
            Resource: arn:aws:s3:::${ORBITA_EKS_BUCKET}
          - Sid: ReadWriteObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: arn:aws:s3:::${ORBITA_EKS_BUCKET}/*

# One managed node group, sized for the default chart: three leaders
# (0.5 vCPU / 1Gi requested, 2Gi limit) and three workers (1 vCPU / 4Gi
# requested, 8Gi limit). m5.xlarge is 4 vCPU / 16Gi, and the node count is three
# so the leader group's soft topology spread lands one leader per node. The
# worker memory *limit* is 8Gi, which fits an m5.xlarge with room for system
# pods; a smaller node would schedule a worker on its requests and then let it
# OOM against a limit larger than the node.
managedNodeGroups:
  - name: orbita
    instanceType: m5.xlarge
    desiredCapacity: 3
    minSize: 3
    maxSize: 4
    # gp3 root volumes, because the whole point of this cluster is to exercise
    # gp3 for data too, and a mixed story is a confusing one.
    volumeType: gp3
    volumeSize: 40
    # The EBS CSI driver needs to attach and detach volumes on behalf of the
    # node; this managed policy is what lets it.
    iam:
      withAddonPolicies:
        ebs: true

# Managed addons. vpc-cni, coredns, and kube-proxy are installed by default;
# aws-ebs-csi-driver is not, and it is what turns the gp3 StorageClass into
# actually-provisioned volumes. wellKnownPolicies makes eksctl create the
# driver's own IRSA role and bind its kube-system service account to it, so the
# controller can attach volumes without the node role carrying that power.
addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
